<!doctype html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
        .ar-marker-btn {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            z-index: 2000;
            padding: 14px 32px;
            font-size: 1.2em;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            opacity: 0.95;
        }

            .ar-marker-btn:active {
                background: #1565c0;
            }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: false;"
             loading-screen="enabled: false;"
             renderer="logarithmicDepthBuffer: true;"
             arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
             id="scene"
             embedded
             gesture-detector>
        <a-assets>
            <a-asset-item id="goat-asset" src="assets/glb/goat.glb"></a-asset-item>
            <a-asset-item id="bear-asset" src="assets/glb/dear.glb"></a-asset-item>
            <a-asset-item id="bird-asset" src="assets/glb/bird.glb"></a-asset-item>
            <a-asset-item id="rhino_cow-asset" src="assets/glb/rhino_cow.glb"></a-asset-item>
            <a-asset-item id="hippo-asset" src="assets/glb/hippo.glb"></a-asset-item>

            <a-asset-item id="hosaka-asset" src="assets/glb/hosaka2.glb"></a-asset-item>
            <a-asset-item id="taniguchi-asset" src="assets/glb/taniguchi.glb"></a-asset-item>
            <a-asset-item id="daiki-asset" src="assets/glb/koba.glb"></a-asset-item>
            <a-asset-item id="okuda-asset" src="assets/glb/okuda.glb"></a-asset-item>
            <a-asset-item id="mikawa-asset" src="assets/glb/mikawa.glb"></a-asset-item>

            <!--gpsからARマーカーに変更-->
            <!--<a-asset-item id="cat-asset" src="assets/glb/cat.glb"></a-asset-item>

            <a-asset-item id="giraffe-asset" src="assets/glb/giraffe.glb"></a-asset-item>
            <a-asset-item id="crocodile-asset" src="assets/glb/crocodile.glb"></a-asset-item>
            <a-asset-item id="dear-asset" src="assets/glb/dear.glb"></a-asset-item>
            <a-asset-item id="horse-asset" src="assets/glb/horse.glb"></a-asset-item>-->
        </a-assets>

        <!--gpsからARマーカーに変更-->
        <!--熊　1テスト-->

        <a-entity id="bear-model" rotation="180 90 180" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#bear-asset" class="clickable" gesture-handler></a-entity>

        <!--8 - サイと牛-->
        <a-marker id="rhino_cow-marker" type="pattern" preset="custom" url="assets/marker/pattern-8.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="rhino_cow-model" rotation="180 90 180" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#rhino_cow-asset" class="clickable" gesture-handler></a-entity>
        </a-marker>
        <!--17 - カバ-->
        <a-marker id="hippo-marker" type="pattern" preset="custom" url="assets/marker/pattern-17.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="hippo-model" rotation="180 90 180" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#hippo-asset" class="clickable" gesture-handler></a-entity>
        </a-marker>
        <!--10 - ヤギ-->
        <a-marker id="goat-marker" type="pattern" preset="custom" url="assets/marker/pattern-10.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="goat-model" rotation="180 90 180" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#goat-asset" class="clickable" gesture-handler></a-entity>

        </a-marker>
        <!--14 - 大貴さん-->
        <a-marker id="koba-marker" type="pattern" preset="custom" url="assets/marker/pattern-14.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="koba-model" rotation="180 90 250" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#koba-asset" class="clickable" gesture-handler></a-entity>
        </a-marker>
        <!--15 - 谷口さん-->
        <a-marker id="taniguchi-marker" type="pattern" preset="custom" url="assets/marker/pattern-15.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="taniguchi-model" rotation="180 90 250" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#taniguchi-asset" class="clickable" gesture-handler></a-entity>
        </a-marker>
        <!--16 - 甫坂さん-->
        <a-marker id="hosaka-marker" type="pattern" preset="custom" url="assets/marker/pattern-16.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="mosaka-model" rotation="180 90 250" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#hosaka-asset" class="clickable" gesture-handler></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <button id="ar-marker-btn" class="ar-marker-btn">かざすモードへ</button>

    <script>
        document.getElementById('ar-marker-btn').addEventListener('click', function () {
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
