<body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: false;"
             loading-screen="enabled: false;"
             renderer="logarithmicDepthBuffer: true;"
             arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
             id="scene"
             embedded
             gesture-detector>
        <a-assets>
            <a-asset-item id="animated-asset"
                          src="/src/assets/rhino.glb"></a-asset-item>
        </a-assets>

        <a-marker id="animated-marker"
                  type="pattern"
                  preset="custom"
                  url="/src/assets/1.patt"
                  raycaster="objects: .clickable"
                  emitevents="true"
                  cursor="fuse: false; rayOrigin: mouse;"
                  id="markerA">
            <a-entity id="bowser-model"
                      scale="2.000013113107827 2.000013113107827 2.000013113107827"
                      animation-mixer="loop: repeat"
                      gltf-model="#animated-asset"
                      class="clickable"
                      gesture-handler></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

    <script>
        // 距離計算用の関数
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // 地球の半径 (メートル)
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dr = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(dp / 2) * Math.sin(dp / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(dr / 2) * Math.sin(dr / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // 距離 (メートル)
        }
