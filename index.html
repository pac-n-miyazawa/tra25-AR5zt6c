<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <h4 class="text_rhino">AR.js + A-Frame + GPS!!!!!! testfhadsifndfskfjndsf</h4>
    <h4 class="text_giraffe">AR.js + A-Frame + GPS!!!!!! testfhadsifndfskfjndsf</h4>
    <h4 class="text_goat">AR.js + A-Frame + GPS!!!!!! testfhadsifndfskfjndsf</h4>
    <h4 class="text_cat">AR.js + A-Frame + GPS!!!!!! testfhadsifndfskfjndsf</h4>
    <a-scene renderer="logarithmicDepthBuffer: true;"
             embedded
             loading-screen="enabled: false;"
             arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="goat-asset" src="assets/goat.glb"></a-asset-item>
            <a-asset-item id="cat-asset" src="assets/cat.glb"></a-asset-item>
            <a-asset-item id="rhino-asset" src="assets/rhino.glb"></a-asset-item>
            <a-asset-item id="giraffe-asset" src="assets/giraffe.glb"></a-asset-item>
        </a-assets>

        <!-- 3Dモデル -->
        <a-entity id="rhino-model"
                  look-at="[gps-camera]"
                  animation-mixer="loop: repeat"
                  gltf-model="#rhino-asset"
                  scale="3.0 3.0 3.0"
                  gps-entity-place="latitude: 35.9658314; longitude: 138.4665064;"
                  visible="false"></a-entity>

        <a-entity id="giraffe-model"
                  look-at="[gps-camera]"
                  animation-mixer="loop: repeat"
                  gltf-model="#giraffe-asset"
                  scale="3.0 3.0 3.0"
                  gps-entity-place="latitude: 35.9657242; longitude: 138.4668413;"
                  visible="false"></a-entity>

        <a-entity id="goat-model"
                  look-at="[gps-camera]"
                  animation-mixer="loop: repeat"
                  gltf-model="#goat-asset"
                  scale="3.0 3.0 3.0"
                  gps-entity-place="latitude: 35.9657294; longitude: 138.4668933;"
                  visible="false"></a-entity>


        <a-entity id="cat-model"
                  look-at="[gps-camera]"
                  animation-mixer="loop: repeat"
                  gltf-model="#cat-asset"
                  scale="3.0 3.0 3.0"
                  gps-entity-place="latitude: 35.9647161; longitude: 138.4672074;"
                  visible="false"></a-entity>




        <!-- カメラ -->
        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        console.log("スタ");
        // 距離計算用の関数
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // 地球の半径 (メートル)
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dr = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(dp / 2) * Math.sin(dp / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(dr / 2) * Math.sin(dr / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // 距離 (メートル)
        }



        // gps-camera の位置情報取得状況を定期的に確認
        setInterval(() => {
            const camera = document.querySelector('a-camera');
            if (camera.components['gps-camera']) {
                const gpsData = camera.components['gps-camera'].currentCoords;
                if (gpsData) {
                    console.log('Current GPS coordinates:', gpsData);

                    const modelLatitude = 35.9073292;
                    const modelLongitude = 138.4489453;

                    const modelLatitude_jitaku = 35.614904;
                    const modelLongitude_jitaku = 139.721611;

                    // 距離を計算
                    const distance = calculateDistance(gpsData.latitude, gpsData.longitude, modelLatitude, modelLongitude);
                    const distance_jitaku = calculateDistance(gpsData.latitude, gpsData.longitude, modelLatitude_jitaku, modelLongitude_jitaku);

                    const distance_rhino = calculateDistance(gpsData.latitude, gpsData.longitude, 35.9658314, 138.4665064);
                    const distance_giraffe = calculateDistance(gpsData.latitude, gpsData.longitude, 35.9657242, 138.4668413);
                    const distance_goat = calculateDistance(gpsData.latitude, gpsData.longitude, 35.9657294, 138.4668933);
                    const distance_cat = calculateDistance(gpsData.latitude, gpsData.longitude, 35.9647161, 138.4672074);

                    console.log(distance);
                    document.querySelector('.text_goat').innerHTML = "AR.js + A-Frame + GPS!!!!!!dsafgasdfja goat:" + distance_goat
                    document.querySelector('.text_cat').innerHTML = "AR.js + A-Frame + GPS!!!!!!dsafgasdfja cat:" + distance_cat
                    document.querySelector('.text_rhino').innerHTML = "AR.js + A-Frame + GPS!!!!!!dsafgasdfja go-cart:" + distance_rhino
                    document.querySelector('.text_giraffe').innerHTML = "AR.js + A-Frame + GPS!!!!!!dsafgasdfja  animal:" + distance_giraffe

                    const model = document.querySelector('#goat-model');
                    const model_jitaku = document.querySelector('#cat-model');
                    const model_rhino = document.querySelector('#rhino-model');
                    const model_giraffe = document.querySelector('#giraffe-model');
                    // 一定の距離 (例: 50メートル) に近づいたら表示
                    if (distance <= 10 || distance_jitaku <= 10 || distance_goat <= 10) {
                        model.setAttribute('visible', 'true');
                    } else {
                        model.setAttribute('visible', 'false');
                    }
                    if (distance_cat <= 10) {
                        model_jitaku.setAttribute('visible', 'true');
                    } else {
                        model_jitaku.setAttribute('visible', 'false');
                    }
                    if (distance_rhino <= 10) {
                        model_rhino.setAttribute('visible', 'true');
                    } else {
                        model_rhino.setAttribute('visible', 'false');
                    }
                    if (distance_giraffe <= 10) {
                        model_giraffe.setAttribute('visible', 'true');
                    } else {
                        model_giraffe.setAttribute('visible', 'false');
                    }
                } else {
                    console.log('GPS coordinates not available yet.');
                }
            } else {
                console.log('gps-camera component not initialized yet.');
            }
        }, 2000); // 2秒ごとに確認

        window.addEventListener('gps-camera-update-position', (event) => {
            console.log('GPS position updated:', event.detail.position);
        });


    </script>
</body>
</html>
