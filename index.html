<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene vr-mode-ui="enabled: false;"
                 loading-screen="enabled: false;"
                 renderer="logarithmicDepthBuffer: true;"
                 arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
                 id="scene"
                 embedded
                 gesture-detector>
            <a-assets>
                <a-asset-item id="rhino-asset" src="assets/rhino.glb"></a-asset-item>
                <a-asset-item id="cat-asset" src="assets/cat.glb"></a-asset-item>
                <a-asset-item id="giraffe-asset" src="assets/giraffe.glb"></a-asset-item>
                <!--<a-asset-item id="goat-asset" src="assets/goat.glb"></a-asset-item>-->
            </a-assets>

            <a-marker id="animated-marker"
                      type="pattern"
                      preset="custom"
                      url="assets/marker.patt"
                      raycaster="objects: .clickable"
                      emitevents="true"
                      cursor="fuse: false; rayOrigin: mouse;"
                      id="markerA">
                <a-entity id="bowser-model"
                          scale="8.784805045491005 8.784805045491005 8.784805045491005"
                          animation-mixer="loop: repeat"
                          gltf-model="#rhino-asset"
                          class="clickable"
                          gesture-handler></a-entity>
            </a-marker>

            <!--<a-marker id="animated-marker2"
                      type="pattern"
                      preset="custom"
                      url="assets/pattern-marker.patt"
                      raycaster="objects: .clickable"
                      emitevents="true"
                      cursor="fuse: false; rayOrigin: mouse;"
                      id="markerA">
                <a-entity id="bowser-model2"
                          scale="8.784805045491005 8.784805045491005 8.784805045491005"
                          animation-mixer="loop: repeat"
                          gltf-model="#cat-asset"
                          class="clickable"
                          gesture-handler></a-entity>
            </a-marker>-->


            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
