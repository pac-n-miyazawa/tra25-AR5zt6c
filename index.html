<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <h4>AR.js + A-Frame + GPS!!!!!!!!!!!!!XS</h4>
    <a-scene renderer="logarithmicDepthBuffer: true;"
             embedded
             loading-screen="enabled: false;"
             arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="goat-asset" src="assets/goat.glb"></a-asset-item>
        </a-assets>

        <!-- 3Dモデル -->
        <a-entity id="goat-model"
                  look-at="[gps-camera]"
                  animation-mixer="loop: repeat"
                  gltf-model="#goat-asset"
                  scale="10.0 10.0 10.0"
                  gps-entity-place="latitude: 35.614904; longitude: 139.721611;"
                  visible="false"></a-entity>

        <!-- カメラ -->
        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        console.log("start");
        // 距離計算用の関数
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // 地球の半径 (メートル)
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dr = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(dp / 2) * Math.sin(dp / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(dr / 2) * Math.sin(dr / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // 距離 (メートル)
        }

        // ユーザーの現在位置を監視
        window.setTimeout(() => {
            console.log("GPS position updated");
            const userLatitude = event.detail.position.latitude;
            const userLongitude = event.detail.position.longitude;

            // モデルの位置
            const modelLatitude = 35.614904;
            const modelLongitude = 139.721611;

            // 距離を計算
            const distance = calculateDistance(userLatitude, userLongitude, modelLatitude, modelLongitude);

            // 一定の距離 (例: 50メートル) に近づいたら表示
            const model = document.querySelector('#goat-model');
            if (distance <= 5) {
                model.setAttribute('visible', 'true');
            } else {
                model.setAttribute('visible', 'false');
            }
        }, 2000);
    </script>
</body>
</html>
